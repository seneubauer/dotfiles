[main]
font=Nunito:weight=Regular:size=14
prompt="Google: "
anchor="center"
width=40
lines=0
dpi-aware=no
show-actions=yes
exit-on-keyboard-focus-loss=yes
hide-before-typing=no
horizontal-pad=20
vertical-pad=15
inner-pad=10
include=~/.config/fuzzel/themes/noctalia

[border]
width=2
radius=3
selection-radius=3

[key-bindings]
prev=Mod1+j
next=Mod1+k
