[main]
font=Nunito:weight=Regular:size=14
prompt=" "
width=40
lines=1
dpi-aware=no
icon-theme=Papirus-Dark
show-actions=yes
exit-on-keyboard-focus-loss=no
hide-before-typing=no
horizontal-pad=20
vertical-pad=15
inner-pad=10
include=~/.config/fuzzel/themes/noctalia

[border]
width=2
radius=3
selection-radius=3

[key-bindings]
prev=Mod1+j
next=Mod1+k
