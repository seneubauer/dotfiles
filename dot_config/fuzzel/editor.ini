[main]
font=JetBrainsMonoNL NFM:weight=Regular:size=14
prompt=" "
width=40
lines=10
dpi-aware=no
icon-theme=Papirus-Dark
show-actions=yes
exit-on-keyboard-focus-loss=no
hide-before-typing=no
include=~/.config/fuzzel/themes/noctalia

[border]
width=1
radius=5
selection-radius=5

[key-bindings]
prev=Mod1+j
next=Mod1+k
