# theme
font: JetBrainsMono Nerd Font 12
background: "{{colors.background.default.hex}}e6"
color: "{{colors.on_surface.default.hex}}"
border: "{{colors.primary.default.hex}}"
separator: " ➜ "
border_width: 2
corner_r: 6
padding: 9
rows_per_column: 5
column_padding: 25

# position
anchor: center 
margin_right: 0
margin_bottom: 0
margin_left: 0
margin_top: 0

# behavior
inhibit_compositor_keyboard_shortcuts: true
auto_kbd_layout: true

menu:
  - key: "p"
    desc: Plugins
    submenu:
      - key: "g"
        desc: Gamer-Mode
        cmd: noctalia msg panel-toggle nomadcxx/gamer-mode:main
      - key: "d"
        desc: Obsidian
        cmd: noctalia msg panel-toggle davemhammer/obsidian:manager
      - key: "u"
        desc: Umbriel Companion
        cmd: noctalia msg panel-toggle noctalia/umbriel-companion:panel
      - key: "s"
        desc: Sticky Notes
        cmd: noctalia msg panel-toggle ahmedhossamdev/sticky-notes:panel
  - key: "t"
    desc: Theme
    submenu:
     -  key: "l"
        desc: Light
        cmd: noctalia msg theme-mode-set light
     -  key: "d"
        desc: Dark
        cmd: noctalia msg theme-mode-set dark
     -  key: "u"
        desc: Update Templates
        cmd: noctalia msg templates-apply
  - key: "m"
    desc: Media
    submenu:
      - key: "j"
        desc: Next
        cmd: noctalia msg media next
      - key: "k"
        desc: Previous
        cmd: noctalia msg media previous
      - key: "p"
        desc: Play/Pause
        cmd: noctalia msg media toggle
      - key: "s"
        desc: Stop
        cmd: noctalia msg media stop
  - key: "d"
    desc: Desktop
    submenu:
      - key: "t"
        desc: Toggle
        cmd: noctalia msg desktop-widgets-toggle
      - key: "e"
        desc: Edit
        cmd: noctalia msg desktop-widgets-toggle-edit
  - key: "s"
    desc: Screenshot
    submenu:
      - key: "r"
        desc: Region
        cmd: noctalia msg screenshot-region
      - key: "f"
        desc: Fullscreen
        cmd: noctalia msg screenshot-fullscreen
      - key: "a"
        desc: Annotate
        cmd: noctalia msg screenshot-annotate
