[keybinds]

# generics
"Mod+Return"            = "spawn:alacritty"

# noctalia shell
"Mod+E"                 = "spawn:noctalia msg panel-toggle launcher"
"Mod+I"                 = "spawn:noctalia msg panel-toggle control-center"
"Mod+Z"                 = "spawn:noctalia msg settings-toggle"
"Mod+V"                 = "spawn:noctalia msg panel-toggle clipboard"
"Mod+W"                 = "spawn:noctalia msg panel-toggle wallpaper"
"Mod+Shift+Q"           = "spawn:noctalia msg panel-toggle session"

# column manip
"Mod+Shift+H"           = "column-move-left"
"Mod+Shift+L"           = "column-move-right"
"Mod+Shift+J"           = "column-move-to-workspace-next"
"Mod+Shift+K"           = "column-move-to-workspace-previous"
"Mod+Shift+Alt+H"       = "column-move-to-output-left"
"Mod+Shift+Alt+L"       = "column-move-to-output-right"
"Mod+Shift+Alt+K"       = "column-move-to-output-up"
"Mod+Shift+Alt+J"       = "column-move-to-output-down"
"Mod+M"                 = "column-center"

# window manip
"Mod+Shift+A"           = "window-toggle-floating"
"Mod+Shift+S"           = "window-toggle-fullscreen"
"Mod+Shift+D"           = "window-toggle-maximize"
"Mod+Q"                 = "window-close"
"Mod+H"                 = "window-focus-left"
"Mod+L"                 = "window-focus-right"
"Mod+K"                 = "window-focus-up"
"Mod+J"                 = "window-focus-down"
"Mod+bracketleft"       = "window-consume-or-expel-left"
"Mod+bracketright"      = "window-consume-or-expel-right"
"Mod+A"                 = "window-set-width:0.333"
"Mod+S"                 = "window-set-width:0.5"
"Mod+D"                 = "window-set-width:0.667"
"Mod+F"                 = "window-set-width:1.0"
"Mod+R"                 = "window-cycle-width"
"Mod+T"                 = "window-cycle-height"

# workspace manip
"Mod+Ctrl+Alt+H"        = "workspace-move-to-output-left"
"Mod+Ctrl+Alt+L"        = "workspace-move-to-output-right"
"Mod+Ctrl+Alt+K"        = "workspace-move-to-output-up"
"Mod+Ctrl+Alt+J"        = "workspace-move-to-output-down"
"Mod+Ctrl+J"            = "workspace-next"
"Mod+Ctrl+K"            = "workspace-previous"
"Mod+Ctrl+S"            = "workspace-set-layout:scrolling"
"Mod+Ctrl+D"            = "workspace-set-layout:dwindle"
"Mod+Ctrl+M"            = "workspace-set-layout:master"
"Mod+1"                 = "workspace-switch:1"
"Mod+2"                 = "workspace-switch:2"
"Mod+3"                 = "workspace-switch:3"
"Mod+4"                 = "workspace-switch:4"
"Mod+5"                 = "workspace-switch:5"

# output manip
"Mod+Alt+H"             = "output-focus-left"
"Mod+Alt+L"             = "output-focus-right"
"Mod+Alt+K"             = "output-focus-up"
"Mod+Alt+J"             = "output-focus-down"

# overview manip
"Mod+O"                 = "overview-toggle"

# scratchpad mapip
"Mod+Space"             = "scratchpad-toggle"
"Mod+Shift+Space"       = "window-toggle-scratchpad"
"Mod+Tab"               = "scratchpad-focus-next"

# system manip
"Mod+Shift+minus"       = "cheatsheet-toggle"

# volume control
"XF86AudioRaiseVolume"  = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume"  = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86AudioMute"         = "spawn:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"

# playback control
"XF86AudioPlay"         = "spawn:playerctl play-pause"
"XF86AudioNext"         = "spawn:playerctl next"
"XF86AudioPrev"         = "spawn:playerctl previous"

# brightness control
"XF86MonBrightnessUp"   = "spawn:brightnessctl set +5%"
"XF86MonBrightnessDown" = "spawn:brightnessctl set -5%"
