[keybinds]

# generics
"Mod+Return"                = "spawn:alacritty"

# noctalia shell
"Mod+Period"                = "spawn:noctalia msg panel-toggle launcher"
"Mod+I"                     = "spawn:noctalia msg panel-toggle control-center"
"Mod+Comma"                 = "spawn:noctalia msg settings-toggle"
"Mod+W"                     = "spawn:noctalia msg panel-toggle wallpaper"
"Alt+Tab"                   = "spawn:noctalia msg window-switcher"

# submap: entry points
"Mod+N"                     = "submap:noctalia"
"submap[noctalia],Y"        = { action = "submap:system", repeat = false }
"submap[noctalia],T"        = { action = "submap:theme", repeat = false }
"submap[noctalia],M"        = { action = "submap:media", repeat = false }
"submap[noctalia],S"        = { action = "submap:screenshot", repeat = false }
"submap[noctalia],W"        = { action = "submap:widgets", repeat = false }
"submap[noctalia],P"        = { action = "submap:power", repeat = false }
"submap[noctalia],Escape"   = "submap:reset"

"Mod+U"                     = "submap:umbriel"
"submap[umbriel],A"         = { action = "submap:window", repeat = false }
"submap[umbriel],S"         = { action = "submap:column", repeat = false }
"submap[umbriel],D"         = { action = "submap:workspace", repeat = false }
"submap[umbriel],Escape"    = "submap:reset"

# submap: system
"submap[system],D"          = { action = "spawn:noctalia msg notification-dnd-toggle", submap = "reset" }
"submap[system],S"          = { action = "spawn:noctalia msg caffeine-toggle", submap = "reset" }
"submap[system],C"          = { action = "spawn:noctalia msg cheatsheet-toggle", submap = "reset" }
"submap[system],Escape"      = "submap:reset"

# submap: theme
"submap[theme],D"           = { action = "spawn:noctalia msg theme-mode-set dark", submap = "reset" }
"submap[theme],L"           = { action = "spawn:noctalia msg theme-mode-set light", submap = "reset" }
"submap[theme],U"           = { action = "spawn:noctalia msg templates-apply", submap = "reset" }
"submap[theme],Escape"      = "submap:reset"

# submap: media
"submap[media],J"           = { action = "spawn:noctalia msg media next", submap = "reset" }
"submap[media],K"           = { action = "spawn:noctalia msg media previous", submap = "reset" }
"submap[media],P"           = { action = "spawn:noctalia msg media toggle", submap = "reset" }
"submap[media],S"           = { action = "spawn:noctalia msg media stop", submap = "reset" }
"submap[media],Escape"      = "submap:reset"

# submap: screenshot
"submap[screenshot],R"      = { action = "spawn:noctalia msg screenshot-region", submap = "reset" }
"submap[screenshot],F"      = { action = "spawn:noctalia msg screenshot-fullscreen", submap = "reset" }
"submap[screenshot],A"      = { action = "spawn:noctalia msg screenshot-annotate", submap = "reset" }
"submap[screenshot],M"      = { action = "spawn:noctalia msg annotate", submap = "reset" }
"submap[screenshot],Escape" = "submap:reset"

# submap: desktop widgets
"submap[widgets],T"         = { action = "spawn:noctalia msg desktop-widgets-toggle", submap = "reset" }
"submap[widgets],E"         = { action = "spawn:noctalia msg desktop-widgets-toggle-edit", submap = "reset" }
"submap[widgets],Escape"    = "submap:reset"

# submap: power profile
"submap[power],P"           = { action = "spawn:noctalia msg power-set performance", submap = "reset" }
"submap[power],B"           = { action = "spawn:noctalia msg power-set balanced", submap = "reset" }
"submap[power],E"           = { action = "spawn:noctalia msg power-set power-saver", submap = "reset" }
"submap[power],Escape"      = "submap:reset"

# submap: window
"submap[window],M"          = { action = "submap:wd_mode", repeat = false }
"submap[window],W"          = { action = "submap:wd_width", repeat = false }
"submap[window],H"          = { action = "submap:wd_height", repeat = false }
"submap[window],Escape"     = "submap:reset"

# submap: window mode
"submap[wd_mode],F"         = { action = "spawn:noctalia msg window-toggle-floating", submap = "reset" }
"submap[wd_mode],S"         = { action = "spawn:noctalia msg window-toggle-fullscreen", submap = "reset" }
"submap[wd_mode],D"         = { action = "spawn:noctalia msg window-toggle-maximize", submap = "reset" }
"submap[wd_mode],Escape"    = "submap:reset"

# submap: window width
"submap[wd_width],A"        = { action = "spawn:noctalia msg window-set-width:0.333", submap = "reset" }
"submap[wd_width],S"        = { action = "spawn:noctalia msg window-set-width:0.5", submap = "reset" }
"submap[wd_width],D"        = { action = "spawn:noctalia msg window-set-width:0.667", submap = "reset" }
"submap[wd_width],F"        = { action = "spawn:noctalia msg window-set-width:1.0", submap = "reset" }
"submap[wd_width],Escape"   = "submap:reset"

# submap: window height
"submap[wd_height],A"       = { action = "spawn:noctalia msg window-set-height:0.333", submap = "reset" }
"submap[wd_height],S"       = { action = "spawn:noctalia msg window-set-height:0.5", submap = "reset" }
"submap[wd_height],D"       = { action = "spawn:noctalia msg window-set-height:0.667", submap = "reset" }
"submap[wd_height],F"       = { action = "spawn:noctalia msg window-set-height:1.0", submap = "reset" }
"submap[wd_height],Escape"  = "submap:reset"

# submap: column
"submap[column],H"          = { action = "spawn:noctalia msg column-move-to-output-left", submap = "reset" }
"submap[column],L"          = { action = "spawn:noctalia msg column-move-to-output-right", submap = "reset" }
"submap[column],K"          = { action = "spawn:noctalia msg column-move-to-output-up", submap = "reset" }
"submap[column],J"          = { action = "spawn:noctalia msg column-move-to-output-down", submap = "reset" }
"submap[column],1"          = { action = "spawn:noctalia msg column-move-to-workspace:1", submap = "reset" }
"submap[column],2"          = { action = "spawn:noctalia msg column-move-to-workspace:2", submap = "reset" }
"submap[column],3"          = { action = "spawn:noctalia msg column-move-to-workspace:3", submap = "reset" }
"submap[column],4"          = { action = "spawn:noctalia msg column-move-to-workspace:4", submap = "reset" }
"submap[column],5"          = { action = "spawn:noctalia msg column-move-to-workspace:5", submap = "reset" }
"submap[column],Escape"     = "submap:reset"

# submap: workspace
"submap[workspace],M"       = { action = "submap:ws_move", repeat = false }
"submap[workspace],L"       = { action = "submap:ws_layout", repeat = false }

# submap: workspace movement
"submap[ws_move],H"         = { action = "spawn:noctalia msg workspace-move-to-output-left", submap = "reset" }
"submap[ws_move],L"         = { action = "spawn:noctalia msg workspace-move-to-output-right", submap = "reset" }
"submap[ws_move],K"         = { action = "spawn:noctalia msg workspace-move-to-output-up", submap = "reset" }
"submap[ws_move],J"         = { action = "spawn:noctalia msg workspace-move-to-output-down", submap = "reset" }
"submap[ws_move],Escape"    = "submap:reset"

# submap: workspace layout
"submap[ws_layout],M"       = { action = "spawn:noctalia msg workspace-set-layout:master", submap = "reset" }
"submap[ws_layout],S"       = { action = "spawn:noctalia msg workspace-set-layout:scrolling", submap = "reset" }
"submap[ws_layout],D"       = { action = "spawn:noctalia msg workspace-set-layout:dwindle", submap = "reset" }
"submap[ws_layout],Escape"  = "submap:reset"

# column manip
"Mod+Shift+H"               = "column-move-left"
"Mod+Shift+L"               = "column-move-right"
"Mod+Shift+J"               = "column-move-to-workspace-next"
"Mod+Shift+K"               = "column-move-to-workspace-previous"
"Mod+M"                     = "column-center"

# window manip
"Mod+Q"                     = "window-close"
"Mod+H"                     = "window-focus-left"
"Mod+L"                     = "window-focus-right"
"Mod+K"                     = "window-focus-up"
"Mod+J"                     = "window-focus-down"
"Mod+bracketleft"           = "window-consume-or-expel-left"
"Mod+bracketright"          = "window-consume-or-expel-right"
"Mod+R"                     = "window-cycle-width"
"Mod+T"                     = "window-cycle-height"

# workspace manip
"Mod+Ctrl+J"                = "workspace-next"
"Mod+Ctrl+K"                = "workspace-previous"
"Mod+1"                     = "workspace-switch:1"
"Mod+2"                     = "workspace-switch:2"
"Mod+3"                     = "workspace-switch:3"
"Mod+4"                     = "workspace-switch:4"
"Mod+5"                     = "workspace-switch:5"

# output manip
"Mod+Alt+H"                 = "output-focus-left"
"Mod+Alt+L"                 = "output-focus-right"
"Mod+Alt+K"                 = "output-focus-up"
"Mod+Alt+J"                 = "output-focus-down"

# overview manip
"Mod+O"                     = "overview-toggle"

# scratchpad mapip
"Mod+Space"                 = "scratchpad-toggle"
"Mod+Shift+Space"           = "window-toggle-scratchpad"
"Mod+Tab"                   = "scratchpad-focus-next"

# volume control
"XF86AudioRaiseVolume"      = "spawn:noctalia msg volume-up"
"XF86AudioLowerVolume"      = "spawn:noctalia msg volume-down"
"XF86AudioMute"             = "spawn:noctalia msg volume-mute"

# playback control
"XF86AudioPlay"             = "spawn:playerctl play-pause"
"XF86AudioNext"             = "spawn:playerctl next"
"XF86AudioPrev"             = "spawn:playerctl previous"

# brightness control
"XF86MonBrightnessUp"       = "spawn:noctalia msg brightness-up"
"XF86MonBrightnessDown"     = "spawn:noctalia msg brightness-down"
